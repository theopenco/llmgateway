# Every host-facing name/port is overridable so multiple worktrees can run
# their own isolated stack side by side. Defaults reproduce the historical
# single-stack setup exactly. STACK_SUFFIX must include its own separator
# (e.g. STACK_SUFFIX=-tel-aviv).
name: llmgateway${STACK_SUFFIX:-}

services:
  postgres:
    container_name: postgres${STACK_SUFFIX:-}
    command: postgres -c log_statement=all
    image: postgres:17-alpine
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: db
      CI: ${CI}
    volumes:
      - ./packages/db/init:/docker-entrypoint-initdb.d

  redis:
    container_name: redis${STACK_SUFFIX:-}
    image: redis:8
    command: ["redis-server", "--protected-mode", "no", "--bind", "0.0.0.0"]
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      CI: ${CI}

  # MinIO: local S3-compatible object storage for offloaded log payload blobs
  # (PAYLOAD_STORAGE_S3_* env). Prod uses GCS via its S3-interoperability API.
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      CI: ${CI}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - minio_data:/data

  # One-shot bucket bootstrap: creates the payload bucket and its 30-day
  # expiry lifecycle rule (blob retention lives here, not in the retention
  # job). Retries on its own so it doesn't depend on setup's fixed sleep.
  minio-init:
    container_name: minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 minioadmin minioadmin && break
          sleep 1
        done
        mc mb -p local/llmgateway-payloads
        mc ilm rule add local/llmgateway-payloads --expire-days 30 || true

  # Storage Redis: Responses API state (30d retention) + gateway response
  # cache. AOF persistence because it holds a source of truth, not just cache.
  redis-storage:
    container_name: redis-storage${STACK_SUFFIX:-}
    image: redis:8
    command:
      [
        "redis-server",
        "--protected-mode",
        "no",
        "--bind",
        "0.0.0.0",
        "--appendonly",
        "yes",
      ]
    restart: always
    ports:
      - "${STORAGE_REDIS_PORT:-6479}:6379"
    environment:
      CI: ${CI}
    volumes:
      - redis_storage_data:/data

volumes:
  minio_data:
  redis_storage_data:
