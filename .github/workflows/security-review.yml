name: security-review

# A separate security pass on PRs that touch code where a bug costs money,
# data or access. Findings land as inline review threads; the main ruleset
# requires every thread to be resolved before merging, so a finding is either
# fixed or closed with a one-line reason.
#
# The reviewer is not hardened against prompt injection, so it runs only for
# branches in this repository, never for forks.

on:
  pull_request:
    paths:
      - apps/api/src/**
      - apps/gateway/src/**
      - apps/worker/src/**
      - packages/actions/src/**
      - packages/shared/src/**
      - packages/db/src/**
      - ee/guardrails/src/**
      - ee/audit/src/**
      - .github/workflows/**
      - .github/scripts/**
      - .github/security-review/**

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Claude Code and the Anthropic SDK both read these, so every call runs
    # through LLM Gateway's Anthropic-compatible endpoint on the "smart"
    # router (the key's project allows it), including Claude Code's
    # background and subagent calls.
    env:
      ANTHROPIC_BASE_URL: https://api.llmgateway.io
      CLAUDE_MODEL: smart
      ANTHROPIC_DEFAULT_OPUS_MODEL: smart
      ANTHROPIC_DEFAULT_SONNET_MODEL: smart
      ANTHROPIC_DEFAULT_HAIKU_MODEL: smart
      CLAUDE_CODE_SUBAGENT_MODEL: smart
    steps:
      # An LLM Gateway API key. Until the secret is set the job warns and
      # passes, so it can be made a required check without blocking PRs.
      - name: Check for the reviewer key
        id: key
        env:
          KEY: ${{ secrets.SECURITY_REVIEW_LLM_GATEWAY_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::SECURITY_REVIEW_LLM_GATEWAY_API_KEY is not set; skipping the security review"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Actions in this job are pinned to commits: the token can write review
      # comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      # anthropics/claude-code-security-review, pinned to a commit on main
      # (2026-02-11); it has no tags. It runs from source instead of as an
      # action because the action installs Claude Code on Node 18, which
      # resolves to a release too old for current models.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          repository: anthropics/claude-code-security-review
          ref: 0c6a49f1fa56a1d472575da86a94dbc1edb78eda
          path: .security-review
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      # The false-positive filter checks API access with a hardcoded model
      # that is deactivated; on failure it silently skips the filter and
      # false-positives.md. Point the check at the review model instead.
      - name: Install the reviewer
        if: steps.key.outputs.present == 'true'
        run: |
          client=.security-review/claudecode/claude_api_client.py
          grep -q '"claude-3-5-haiku-20241022"' "$client"
          sed -i "s/\"claude-3-5-haiku-20241022\"/\"$CLAUDE_MODEL\"/" "$client"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r .security-review/claudecode/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          npm install -g @anthropic-ai/claude-code@2.1.304

      # The scanner exits non-zero when it keeps a high-severity finding; the
      # findings get posted first, then the job fails on them below.
      - name: Scan
        if: steps.key.outputs.present == 'true'
        working-directory: .security-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ANTHROPIC_API_KEY: ${{ secrets.SECURITY_REVIEW_LLM_GATEWAY_API_KEY }}
          REPO_PATH: ${{ github.workspace }}
          ENABLE_CLAUDE_FILTERING: "true"
          EXCLUDE_DIRECTORIES: node_modules,dist,.next,.security-review,apps/docs,apps/mobile/ios,apps/mobile/android,marketing
          CUSTOM_SECURITY_SCAN_INSTRUCTIONS: ${{ github.workspace }}/.github/security-review/scan-instructions.md
          FALSE_POSITIVE_FILTERING_INSTRUCTIONS: ${{ github.workspace }}/.github/security-review/false-positives.md
        run: |
          claude --version
          PYTHONPATH="$PWD" python -u claudecode/github_action_audit.py \
            > "$GITHUB_WORKSPACE/claudecode-results.json" \
            2> "$GITHUB_WORKSPACE/claudecode-error.log" ||
            echo "::warning::scanner exited with code $?"

      # A green job must mean the code was actually reviewed.
      - name: Fail when the scan did not run
        if: steps.key.outputs.present == 'true'
        run: |
          if [ ! -s claudecode-results.json ]; then
            echo "::error::security review produced no results"
            cat claudecode-error.log
            exit 1
          fi
          if ! jq empty claudecode-results.json; then
            echo "::error::security review results are not valid JSON"
            exit 1
          fi
          if jq -e '.error' claudecode-results.json > /dev/null; then
            echo "::error::security review failed: $(jq -r '.error' claudecode-results.json)"
            exit 1
          fi
          if ! jq -e '.analysis_summary.review_completed == true' claudecode-results.json > /dev/null; then
            echo "::error::security review did not complete (no parseable analysis)"
            exit 1
          fi
          jq '.findings // []' claudecode-results.json > findings.json
          echo "findings: $(jq length findings.json)"

      # The scanner's own comment script skips the whole run once any security
      # comment exists on the PR, so findings from later commits would never be
      # posted. This one deduplicates per finding instead.
      - name: Comment findings
        if: steps.key.outputs.present == 'true'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const { postFindings } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/security-review-comment.mjs`);
            await postFindings({ github, context, core });

      # findings-open.json holds the high-severity findings without a resolved
      # thread. Resolving a thread with a reason and re-running the job clears
      # a false positive; editing the flagged line outdates the thread, and
      # the finding needs a fresh resolution if it is still reported.
      - name: Fail on open high-severity findings
        if: steps.key.outputs.present == 'true'
        run: |
          open=$(jq length findings-open.json)
          if [ "$open" -gt 0 ]; then
            jq -r '.[] | "::error file=\(.path),line=\(.line)::open high-severity security finding"' findings-open.json
            echo "::error::$open high-severity finding(s) open; fix the code, or resolve the thread with a reason and re-run this job"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: security-review-results
          path: |
            findings.json
            findings-open.json
            claudecode-results.json
            claudecode-error.log
          retention-days: 7
          if-no-files-found: ignore
