name: test-playwright

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      STACK_SUFFIX: -playwright
      API_URL: http://localhost:4002
      UI_URL: http://localhost:3002
      APP_URL: http://localhost:3002
      GATEWAY_URL: http://localhost:4001
      PLAYGROUND_URL: http://localhost:3003
      CODE_URL: http://localhost:3004
      DOCS_URL: http://localhost:3005
      AIRSIDE_URL: http://localhost:3007
      SSO_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build apps for the local stack
        # Next.js rewrites embed these URLs at build time. Do not restore
        # remote build artifacts made with the production URL defaults.
        run: pnpm build --env-mode=loose --cache=local:rw

      - name: Seed the database
        run: pnpm run setup

      - name: Run browser test shard ${{ matrix.shard }}
        run: |
          export ONBOARDING_SPONSOR_SECRET="$(openssl rand -hex 32)"
          pnpm test:browser --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: docker compose down -v

  # Named `run` so the aggregated check stays `playwright / run`.
  run:
    runs-on: ubuntu-latest
    needs: shard
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download all shard results
        uses: actions/download-artifact@v8
        with:
          path: ./blob-reports
          pattern: playwright-blob-*
          merge-multiple: true

      - name: Merge reports
        run: pnpm exec playwright merge-reports --reporter html ./blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # merge-reports exits 0 even when tests failed, so the shard result is
      # the pass/fail signal.
      - name: Fail if any shard did not succeed
        if: always() && needs.shard.result != 'success'
        run: |
          echo "shard result was '${{ needs.shard.result }}', expected 'success'."
          exit 1
