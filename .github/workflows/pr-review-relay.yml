name: pr-review-relay

# pull_request_review runs on the PR merge ref with a read-only token for
# forks, so it cannot post statuses or load repository scripts. This workflow
# exists only so that its completion fires workflow_run in pr-risk.yml, which
# runs on the default branch with a write token and recomputes the risk gate
# from the API.

on:
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - run: echo "review on pull request $PR; pr-risk recomputes the gate via workflow_run"
        env:
          PR: ${{ github.event.pull_request.number }}
