name: e2e
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/gateway/**"
      - "packages/models/**"
      - "**/*.e2e.ts"
      - ".github/workflows/e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-shard-1:
    uses: ./.github/workflows/run.yml
    secrets: inherit
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    with:
      cmd: pnpm run setup && cross-env-shell "DATABASE_URL=${DATABASE_URL:-postgres://postgres:pw@localhost:5432/test}" E2E_TEST=true vitest run -c vitest/vitest.e2e.config.mts --no-file-parallelism --shard=1/5 --reporter=blob --outputFile=e2e-results-1.blob
      upload_artifacts: true
      artifact_name: e2e-results-1
      artifact_path: e2e-results-1.blob

  e2e-shard-2:
    uses: ./.github/workflows/run.yml
    secrets: inherit
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    with:
      cmd: pnpm run setup && cross-env-shell "DATABASE_URL=${DATABASE_URL:-postgres://postgres:pw@localhost:5432/test}" E2E_TEST=true vitest run -c vitest/vitest.e2e.config.mts --no-file-parallelism --shard=2/5 --reporter=blob --outputFile=e2e-results-2.blob
      upload_artifacts: true
      artifact_name: e2e-results-2
      artifact_path: e2e-results-2.blob

  e2e-shard-3:
    uses: ./.github/workflows/run.yml
    secrets: inherit
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    with:
      cmd: pnpm run setup && cross-env-shell "DATABASE_URL=${DATABASE_URL:-postgres://postgres:pw@localhost:5432/test}" E2E_TEST=true vitest run -c vitest/vitest.e2e.config.mts --no-file-parallelism --shard=3/5 --reporter=blob --outputFile=e2e-results-3.blob
      upload_artifacts: true
      artifact_name: e2e-results-3
      artifact_path: e2e-results-3.blob

  e2e-shard-4:
    uses: ./.github/workflows/run.yml
    secrets: inherit
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    with:
      cmd: pnpm run setup && cross-env-shell "DATABASE_URL=${DATABASE_URL:-postgres://postgres:pw@localhost:5432/test}" E2E_TEST=true vitest run -c vitest/vitest.e2e.config.mts --no-file-parallelism --shard=4/5 --reporter=blob --outputFile=e2e-results-4.blob
      upload_artifacts: true
      artifact_name: e2e-results-4
      artifact_path: e2e-results-4.blob

  e2e-shard-5:
    uses: ./.github/workflows/run.yml
    secrets: inherit
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    with:
      cmd: pnpm run setup && cross-env-shell "DATABASE_URL=${DATABASE_URL:-postgres://postgres:pw@localhost:5432/test}" E2E_TEST=true vitest run -c vitest/vitest.e2e.config.mts --no-file-parallelism --shard=5/5 --reporter=blob --outputFile=e2e-results-5.blob
      upload_artifacts: true
      artifact_name: e2e-results-5
      artifact_path: e2e-results-5.blob

  merge-reports:
    runs-on: ubuntu-latest
    needs: [e2e-shard-1, e2e-shard-2, e2e-shard-3, e2e-shard-4, e2e-shard-5]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Collect versions
        run: |
          echo "nodejs_version=$(cat .tool-versions | grep 'nodejs' | cut -d ' ' -f 2)" >> "$GITHUB_ENV"
          echo "pnpm_version=$(cat .tool-versions | grep 'pnpm' | cut -d ' ' -f 2)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.pnpm_version }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.nodejs_version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          path: ./e2e-results
          pattern: e2e-results-*

      - name: Merge reports
        run: |
          # Move all .blob files to root directory
          find ./e2e-results -name "*.blob" -exec mv {} ./ \;
          # Merge reports
          cross-env-shell "DATABASE_URL=${DATABASE_URL:-postgres://postgres:pw@localhost:5432/test}" E2E_TEST=true vitest run -c vitest/vitest.e2e.config.mts --merge-reports

  e2e:
    runs-on: ubuntu-latest
    needs:
      [
        e2e-shard-1,
        e2e-shard-2,
        e2e-shard-3,
        e2e-shard-4,
        e2e-shard-5,
        merge-reports,
      ]
    if: always()
    steps:
      - name: Check shard results
        run: |
          if [[ "${{ needs.e2e-shard-1.result }}" == "success" && \
                "${{ needs.e2e-shard-2.result }}" == "success" && \
                "${{ needs.e2e-shard-3.result }}" == "success" && \
                "${{ needs.e2e-shard-4.result }}" == "success" && \
                "${{ needs.e2e-shard-5.result }}" == "success" && \
                "${{ needs.merge-reports.result }}" == "success" ]]; then
            echo "All e2e tests passed"
            exit 0
          else
            echo "E2E tests failed"
            exit 1
          fi
