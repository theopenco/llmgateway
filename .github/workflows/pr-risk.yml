name: pr-risk

# Risk-scaled human review. The change sets the tier, not the author.
#
# classify — on CodeRabbit's walkthrough comment (it carries a Merge Risk
#   line), labels the PR risk: low / medium / high and asks a maintainer to
#   review the high-risk ones.
#
# gate — publishes the `risk-gate` commit status on the PR head. It
#   recomputes the tier from the changed files (labels can only raise it) and
#   fails while a high-risk PR, or any PR from an outside author, lacks a
#   maintainer approval of the current head commit. Runs on PR open/sync,
#   after classify, and after a review. Make it a required status check on
#   main so the approval is enforced, not advisory.
#
# relay — pull_request_review runs on the PR merge ref with a read-only
#   token for forks, so it must not post statuses or load repo scripts. It
#   only exists so that its completion fires workflow_run, which runs on the
#   default branch with a write token and recomputes the gate from the API.
#
# merge-queue — the queue re-runs checks on a synthetic commit that no
#   approval covers; the gate already passed on the PR head, so report success.
#
# Fork safety: every job that holds a write token checks out the default
# branch only (sparse, .github/scripts) and never runs PR code.

on:
  issue_comment:
    types:
      - created
      - edited
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - dismissed
  workflow_run:
    workflows:
      - pr-risk
    types:
      - completed
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  classify:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'coderabbitai[bot]' &&
      contains(github.event.comment.body, 'Merge Risk:')
    runs-on: ubuntu-latest
    concurrency:
      group: pr-risk-classify-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { HIGH_PATHS, LABELS, classifyRisk, parseCodeRabbitLevel, pickReviewer } =
              await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-risk.mjs`);
            const MARKER = "<!-- pr-risk-review -->";

            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const author = context.payload.issue.user.login;

            const codeRabbitLevel = parseCodeRabbitLevel(context.payload.comment.body);
            if (!codeRabbitLevel) {
              core.warning("Could not parse Merge Risk from the CodeRabbit comment; classifying from paths only.");
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const { risk, fromPaths, changedLines, paths } = classifyRisk({ files, codeRabbitLevel, author });
            core.info(`CodeRabbit: ${codeRabbitLevel ?? "none"}; paths: ${fromPaths}; ${changedLines} lines; author: ${author}; risk: ${risk}`);

            for (const label of Object.values(LABELS)) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            const current = context.payload.issue.labels.map((l) => l.name);
            for (const [key, label] of Object.entries(LABELS)) {
              if (key !== risk && current.includes(label.name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: label.name });
              }
            }
            if (!current.includes(LABELS[risk].name)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [LABELS[risk].name] });
            }

            if (risk !== "high") return;

            const reviewer = pickReviewer(number, author);
            if (!reviewer) return;

            // The review request and the explanation comment are tracked separately:
            // a failed request is retried on the next CodeRabbit update even after
            // the comment has been posted.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
            const alreadyAsked =
              pr.requested_reviewers.some((u) => u.login.toLowerCase() === reviewer) ||
              reviews.some((r) => r.user?.login.toLowerCase() === reviewer);
            if (!alreadyAsked) {
              try {
                await github.rest.pulls.requestReviewers({ owner, repo, pull_number: number, reviewers: [reviewer] });
              } catch (error) {
                core.warning(`Could not request a review from ${reviewer}: ${error.message}`);
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            if (comments.some((c) => c.body?.includes(MARKER))) return;

            const reasons = [];
            if (codeRabbitLevel === "high") reasons.push("CodeRabbit rated the merge risk high");
            if (fromPaths === "high") {
              const hits = paths.filter((p) => HIGH_PATHS.some((re) => re.test(p))).slice(0, 5);
              reasons.push(`touches high-risk paths: ${hits.map((p) => `\`${p}\``).join(", ")}`);
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: `${MARKER}\n@${reviewer} this PR is labelled **risk: high** (${reasons.join("; ")}). The \`risk-gate\` check stays red until a maintainer approves the latest commit.`,
            });

  relay:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "review on pull request $PR; the gate recomputes via workflow_run"
        env:
          PR: ${{ github.event.pull_request.number }}

  gate:
    needs: classify
    if: >-
      always() &&
      (
        github.event_name == 'pull_request_target' ||
        (github.event_name == 'issue_comment' && needs.classify.result == 'success') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_review')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: pr-risk-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { STATUS_CONTEXT, classifyRisk, gateDecision, labelRisk, RANK } =
              await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-risk.mjs`);

            const { owner, repo } = context.repo;
            let number = context.payload.pull_request?.number ?? context.payload.issue?.number;
            if (!number && context.eventName === "workflow_run") {
              // workflow_run.pull_requests is empty for forks; resolve by head sha.
              const run = context.payload.workflow_run;
              number = run.pull_requests[0]?.number;
              if (!number) {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: run.head_sha });
                number = prs.find((p) => p.state === "open")?.number ?? prs[0]?.number;
              }
            }
            if (!number) {
              core.info("No pull request for this event; nothing to gate.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });

            const fromFiles = classifyRisk({ files, author: pr.user.login }).risk;
            const fromLabel = labelRisk(pr.labels.map((l) => l.name));
            const risk = fromLabel && RANK[fromLabel] > RANK[fromFiles] ? fromLabel : fromFiles;

            const decision = gateDecision({ risk, author: pr.user.login, reviews, headSha: pr.head.sha });
            core.info(`${STATUS_CONTEXT} ${decision.state} @ ${pr.head.sha} (files: ${fromFiles}, label: ${fromLabel ?? "none"}): ${decision.description}`);
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pr.head.sha,
              state: decision.state,
              context: STATUS_CONTEXT,
              description: decision.description.slice(0, 140),
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

  merge-queue:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.sha,
              state: "success",
              context: "risk-gate",
              description: "merge queue: gate passed on the pull request head",
            });
