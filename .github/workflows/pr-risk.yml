name: pr-risk

# Labels every PR as risk: low / medium / high once CodeRabbit has reviewed it,
# and asks a maintainer to review the high-risk ones.
#
# Runs on CodeRabbit's walkthrough comment (posted and edited after each review),
# so it fires after CodeRabbit is done. issue_comment always runs from the
# default branch with a write token, including for fork PRs; no PR code is
# checked out or executed.

on:
  issue_comment:
    types:
      - created
      - edited

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-risk-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'coderabbitai[bot]' &&
      contains(github.event.comment.body, 'Merge Risk:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const REVIEWERS = ["smakosh", "steebchen"];
            const LABELS = {
              high: { name: "risk: high", color: "d73a4a", description: "High-risk change; needs a maintainer review" },
              medium: { name: "risk: medium", color: "fbca04", description: "Moderate-risk change" },
              low: { name: "risk: low", color: "0e8a16", description: "Low-risk change" },
            };
            const MARKER = "<!-- pr-risk-review -->";
            const RANK = { low: 0, medium: 1, high: 2 };

            const { owner, repo } = context.repo;
            const number = context.issue.number;

            // CodeRabbit's walkthrough ends with "**Merge Risk:** **⚪ Minimal**",
            // "🔵 Low", "🟡 Moderate", or a higher level.
            const match = context.payload.comment.body.match(/\*\*Merge Risk:\*\*\s*\*\*[^A-Za-z]*([A-Za-z]+)/);
            const level = match?.[1]?.toLowerCase() ?? "";
            const fromCodeRabbit =
              ["minimal", "low"].includes(level) ? "low"
              : ["moderate", "medium"].includes(level) ? "medium"
              : level ? "high"
              : "low";

            // Paths where a mistake costs money, data or access, regardless of size.
            const HIGH_PATHS = [
              /^packages\/db\/migrations\//,
              /^packages\/db\/src\/schema\.ts$/,
              /^apps\/api\/src\/auth\//,
              /^apps\/api\/src\/routes\/(payments|platform-webhooks|stripe)/,
              /^\.github\/workflows\//,
            ];
            const MEDIUM_PATHS = [
              /^apps\/gateway\/src\//,
              /^apps\/api\/src\//,
              /^apps\/worker\/src\//,
              /^packages\/actions\/src\//,
              /^ee\/guardrails\/src\//,
            ];
            const GENERATED = /(^|\/)(pnpm-lock\.yaml|snapshot\.json)$|\.(png|jpe?g|webp|svg|csv)$/;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const paths = files.map((f) => f.filename);
            const changedLines = files
              .filter((f) => !GENERATED.test(f.filename))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);

            let fromPaths = "low";
            if (paths.some((p) => HIGH_PATHS.some((re) => re.test(p)))) fromPaths = "high";
            else if (paths.some((p) => MEDIUM_PATHS.some((re) => re.test(p))) || changedLines > 1000) fromPaths = "medium";

            const risk = RANK[fromPaths] > RANK[fromCodeRabbit] ? fromPaths : fromCodeRabbit;
            core.info(`CodeRabbit: ${level || "none"} -> ${fromCodeRabbit}; paths: ${fromPaths}; ${changedLines} lines; risk: ${risk}`);

            for (const label of Object.values(LABELS)) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            const current = context.payload.issue.labels.map((l) => l.name);
            for (const [key, label] of Object.entries(LABELS)) {
              if (key !== risk && current.includes(label.name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: label.name });
              }
            }
            if (!current.includes(LABELS[risk].name)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [LABELS[risk].name] });
            }

            if (risk !== "high") return;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            if (comments.some((c) => c.body?.includes(MARKER))) return;

            const author = context.payload.issue.user.login;
            const candidates = REVIEWERS.filter((r) => r.toLowerCase() !== author.toLowerCase());
            if (candidates.length === 0) return;
            const reviewer = candidates[number % candidates.length];

            await github.rest.pulls.requestReviewers({ owner, repo, pull_number: number, reviewers: [reviewer] });

            const reasons = [];
            if (fromCodeRabbit === "high") reasons.push(`CodeRabbit rated the merge risk **${match[1]}**`);
            if (fromPaths === "high") {
              const hits = paths.filter((p) => HIGH_PATHS.some((re) => re.test(p))).slice(0, 5);
              reasons.push(`touches high-risk paths: ${hits.map((p) => `\`${p}\``).join(", ")}`);
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: `${MARKER}\n@${reviewer} this PR is labelled **risk: high** (${reasons.join("; ")}). CodeRabbit has reviewed it; please review before merging.`,
            });
