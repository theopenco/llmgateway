name: ci
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

# A new commit on a PR supersedes the run for the previous one. Pushes to main
# and merge queue entries each keep their own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: github.event_name == 'pull_request' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # pull_request.base.sha stays at the base the PR was opened against, so
      # compare with the base branch as it is now.
      - name: Ensure at most one new migration
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-new-migrations.sh "origin/$BASE_REF" "$HEAD_SHA"

  build:
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  lint:
    needs: build
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/gate.yml
    with:
      outcome: ${{ needs.build.outputs.lint }}
      step: pnpm lint

  generate:
    needs: build
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/gate.yml
    with:
      outcome: ${{ needs.build.outputs.generate }}
      step: git diff --exit-code

  migrations:
    # Fails when this PR's migrations and ones merged since it branched touch
    # the same objects. The migrator applies them out of order, and git no
    # longer conflicts, so this is the only guard. The lint flags statements
    # that hold long ACCESS EXCLUSIVE locks on live tables.
    uses: ./.github/workflows/run.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      cmd: pnpm migrations:check && pnpm migrations:lint

  test:
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  playwright:
    uses: ./.github/workflows/test-playwright.yml
    permissions:
      contents: read
      id-token: write
