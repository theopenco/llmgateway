name: Compress Images

on:
  pull_request:
    paths:
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"
      - "**/*.avif"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Check for image-actions loop
        id: loop-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # On pull_request, actions/checkout checks out the merge ref, whose
          # subject is "Merge <sha> into <sha>" — so read the PR head commit
          # from the API instead, otherwise the guard never matches and every
          # optimisation push re-triggers this workflow.
          if [[ -n "$HEAD_SHA" ]]; then
            LAST_MSG=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.commit.message' | head -n1)
          else
            LAST_MSG=$(git log -1 --pretty=%s)
          fi
          echo "Head commit subject: $LAST_MSG"
          if [[ "$LAST_MSG" == *"Optimised images with calibre/image-actions"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Compress PR images
        if: steps.loop-check.outputs.skip != 'true'
        uses: steebchen/image-actions@v1.0.0
        with:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # use custom token so actions get triggered on push
