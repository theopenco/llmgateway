version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 5
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 5
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    # List every workspace so security updates for a dependency used in several
    # package.json files land in one PR instead of one per directory.
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
      - "/ee/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      all:
        group-by: dependency-name
        patterns:
          - "*"
      abinnovision:
        patterns:
          - "@abinnovision/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      fortawesome:
        patterns:
          - "@fortawesome/*"
      next:
        patterns:
          - "@next/*"
          - "next"
      heroui:
        patterns:
          - "@heroui/*"
      drizzle:
        patterns:
          - "drizzle-kit"
          - "drizzle-orm"
      prisma:
        patterns:
          - "@prisma/client"
          - "prisma"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      radix:
        patterns:
          - "@radix-ui/*"
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
          - "@better-fetch/*"
