packages:
  - apps/*
  - packages/*
  - ee/*

verifyDepsBeforeRun: false

overrides:
  shiki: 3.22.0
  flatted: '>=3.4.0'
  rollup: '>=4.59.0'
  handlebars: '>=4.7.9'
  protobufjs: ^7.5.5

packageExtensions:
  '@hookform/resolvers':
    peerDependencies:
      zod: '*'

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  sharp: true
  protobufjs: false
  unrs-resolver: false

ignoredBuiltDependencies:
  - protobufjs
  - unrs-resolver

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - core-js
  - esbuild
  - sharp
