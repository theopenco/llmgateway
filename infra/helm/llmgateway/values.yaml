# -- LLM Gateway Helm Chart Values
# Full documentation: https://llmgateway.io/docs

# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""
# -- Use an existing Kubernetes Secret instead of creating one (must contain all required keys)
existingSecret: ""

# =============================================================================
# Global settings
# =============================================================================
global:
  # -- Default image registry for all services
  image:
    registry: ghcr.io
    # -- Default image tag (overrides appVersion from Chart.yaml)
    tag: ""
  # -- Additional labels applied to all resources
  labels: {}
  # -- Image pull secrets for private registries
  imagePullSecrets: []
  # -- Node environment
  nodeEnv: production

# =============================================================================
# Enterprise license
# =============================================================================
enterprise:
  # -- Signed Enterprise or white-label license. Store in existingSecret for production.
  license: ""

# =============================================================================
# Public-facing URLs
# Set these to match your Ingress hostnames or external load balancer URLs.
# =============================================================================
urls:
  ui: ""
  api: ""
  gateway: ""
  playground: ""
  code: ""
  docs: ""
  admin: ""

# =============================================================================
# Authentication & Security
# =============================================================================
auth:
  # -- (required) Secret used for signing auth tokens (32+ characters)
  authSecret: "change-me-to-a-random-32-char-secret"
  # -- (required) HMAC secret for hashing API keys and deriving the BYOK
  # encryption-at-rest data key
  gatewayApiKeyHashSecret: "change-me-to-a-random-secret"
  # -- Shared secret letting the API tell the gateway a request is the
  # onboarding wizard's first call, which is served without charging for it. A
  # brand new organization has 0 credits, so without this the first thing a user
  # does returns a 402. Leave empty to bill that call normally.
  onboardingSponsorSecret: ""
  # -- Cookie domain for session cookies
  cookieDomain: ""
  # -- Comma-separated list of allowed CORS origins
  originUrls: ""
  # -- Enable hosted mode
  hosted: ""
  # -- GitHub OAuth
  github:
    clientId: ""
    clientSecret: ""
  # -- Google OAuth
  google:
    clientId: ""
    clientSecret: ""
  # -- Passkey / WebAuthn configuration
  passkey:
    rpId: ""
    rpName: "LLMGateway"

# =============================================================================
# Database connection pool settings
# =============================================================================
database:
  poolMax: 20
  poolMin: 2
  idleTimeoutMs: 30000
  connectionTimeoutMs: 10000

# =============================================================================
# API Service
# =============================================================================
api:
  enabled: true
  replicas: 1
  # -- Run database migrations on startup
  runMigrations: true
  image:
    registry: ""
    repository: theopenco/llmgateway-api
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  config:
    keepAliveTimeoutS: 60
    timeoutMs: 5000
  # -- Additional environment variables
  extraEnv: []
  nodeSelector: {}
  tolerations: []

# =============================================================================
# Gateway Service
# =============================================================================
gateway:
  enabled: true
  replicas: 1
  image:
    registry: ""
    repository: theopenco/llmgateway-gateway
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  # -- Internal-only port for the Prometheus /metrics endpoint. Exposed via the
  # ClusterIP Service for in-cluster scraping; never routed by the ingress.
  metricsPort: 9090
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  config:
    gatewayTimeoutMs: 1500000
    aiStreamingTimeoutMs: 1200000
    aiTimeoutMs: 600000
    keepAliveTimeoutS: 620
    shutdownGracePeriodMs: 1200000
    healthCheckSkipDatabase: ""
    healthCheckTimeoutMs: 15000
    maxStreamingBufferMb: 50
    # Upstream dispatcher tuning for the gateway→provider hop. Both default in
    # code (300s DNS cache, 60s keep-alive); set here only to override.
    upstreamDnsCacheTtlMs: ""
    upstreamKeepaliveTimeoutMs: ""
  # Hard deadline for pod shutdown; caps every in-process drain above. Defaults
  # to 120s, or realtime.config.maxSessionSeconds + 120 when realtime.enabled.
  # Set explicitly only to override that.
  terminationGracePeriodSeconds: ""
  # -- Per-organization rate-limit, spend-cap and top-up-velocity overrides, as
  # raw env vars, e.g. GATEWAY_RATE_LIMIT_CHAT_COMPLETIONS_RPM,
  # GATEWAY_SPEND_TIER_2_DAILY_CAP_USD, GATEWAY_SPEND_TIER_1_TOPUP_DAILY_CAP_USD,
  # GATEWAY_RATE_LIMITS_ENABLED, GATEWAY_SPEND_CAPS_ENABLED,
  # GATEWAY_TOPUP_VELOCITY_ENABLED. Set them here rather than in `extraEnv`:
  # these render into the shared ConfigMap so every consumer sees the same
  # values — the gateway enforces the rate limits and spend caps, the api and
  # worker enforce the top-up velocity caps, and the dashboard reports them.
  rateLimits: {}
  extraEnv: []
  nodeSelector: {}
  tolerations: []

# =============================================================================
# Realtime (/v1/realtime WebSocket proxy)
# =============================================================================
# Hosted inside the gateway process, not as its own deployment: a separate
# deployment would need the same drain-before-shutdown behaviour anyway, so it
# buys isolation at the cost of another service to operate. Disabled by default
# (staged rollout).
#
# Enabling this raises the gateway's terminationGracePeriodSeconds to cover
# maxSessionSeconds, because a rolling deploy waits for live calls to hang up
# before retiring a pod. Sessions also pin a caller to one pod for their whole
# duration, so watch gateway memory as concurrency grows.
realtime:
  enabled: false
  config:
    # Hard per-session duration cap in seconds (OpenAI caps sessions at 60m).
    # Also sets how long a gateway pod may spend draining on shutdown.
    maxSessionSeconds: 3600
    # Hard per-session spend cap in USD.
    maxSessionSpendUsd: "10"
    # Redis-leased concurrency caps.
    maxSessionsPerOrg: 20
    maxSessionsPerKey: 10

# =============================================================================
# UI Dashboard (Next.js)
# =============================================================================
ui:
  enabled: true
  replicas: 1
  image:
    registry: ""
    repository: theopenco/llmgateway-ui
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraEnv: []
  nodeSelector: {}
  tolerations: []

# =============================================================================
# Playground (Next.js)
# =============================================================================
playground:
  enabled: true
  replicas: 1
  image:
    registry: ""
    repository: theopenco/llmgateway-playground
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraEnv: []
  nodeSelector: {}
  tolerations: []

# =============================================================================
# Code App (Next.js)
# =============================================================================
code:
  enabled: true
  replicas: 1
  image:
    registry: ""
    repository: theopenco/llmgateway-code
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraEnv: []
  nodeSelector: {}
  tolerations: []

# =============================================================================
# Documentation (Next.js)
# =============================================================================
docs:
  enabled: true
  replicas: 1
  image:
    registry: ""
    repository: theopenco/llmgateway-docs
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  extraEnv: []
  nodeSelector: {}
  tolerations: []

# =============================================================================
# Admin Dashboard (Enterprise, Next.js)
# =============================================================================
admin:
  enabled: true
  replicas: 1
  image:
    registry: ""
    repository: theopenco/llmgateway-admin
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraEnv: []
  nodeSelector: {}
  tolerations: []

# =============================================================================
# Background Worker
# =============================================================================
worker:
  enabled: true
  replicas: 1
  image:
    registry: ""
    repository: theopenco/llmgateway-worker
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  config:
    backfillDurationSeconds: 300
    enableDataRetentionCleanup: false
    emailFollowUps: false
    logQueueBatchSize: 100
    creditBatchSize: 100
    creditBatchInterval: 5
  extraEnv: []
  nodeSelector: {}
  tolerations: []

# =============================================================================
# Built-in PostgreSQL
# Set enabled: false to use an external database (configure externalPostgresql).
# =============================================================================
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  user: postgres
  password: "changeme"
  database: llmgateway
  port: 5432
  persistence:
    size: 10Gi
    # -- Storage class (leave empty for cluster default)
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- External PostgreSQL (used when postgresql.enabled is false)
externalPostgresql:
  host: ""
  port: 5432
  user: postgres
  password: ""
  database: llmgateway

# =============================================================================
# Built-in Redis
# Set enabled: false to use an external Redis (configure externalRedis).
# =============================================================================
redis:
  enabled: true
  image:
    repository: redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  # -- Redis password (leave empty for no authentication)
  password: ""
  port: 6379
  persistence:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -- External Redis (used when redis.enabled is false)
externalRedis:
  host: ""
  port: 6379
  password: ""

# =============================================================================
# Built-in Storage Redis
# Dedicated instance for Responses API state (30-day retention) and gateway
# response caching. Runs with AOF persistence since it holds a source of
# truth, not just cache. Set enabled: false to use an external instance
# (configure externalStorageRedis); with neither configured, the apps fall
# back to the main Redis connection.
# =============================================================================
storageRedis:
  enabled: true
  image:
    repository: redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  # -- Redis password (leave empty for no authentication)
  password: ""
  port: 6379
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

# -- External storage Redis (used when storageRedis.enabled is false)
externalStorageRedis:
  host: ""
  port: 6379
  password: ""

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: false
  # -- Ingress class name (e.g., nginx, traefik)
  className: ""
  # -- Additional Ingress annotations
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  # -- Per-service hostnames
  hosts:
    ui: ""
    api: ""
    gateway: ""
    playground: ""
    code: ""
    docs: ""
    admin: ""
  # -- TLS configuration
  tls: []
  #  - secretName: llmgateway-tls
  #    hosts:
  #      - app.example.com
  #      - api.example.com
  #      - gateway.example.com

