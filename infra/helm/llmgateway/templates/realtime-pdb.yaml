{{- if and .Values.realtime.enabled .Values.realtime.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "llmgateway.fullname" . }}-realtime
  labels:
    {{- include "llmgateway.componentLabels" (dict "context" . "component" "realtime") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.realtime.podDisruptionBudget.maxUnavailable | default 0 }}
  selector:
    matchLabels:
      {{- include "llmgateway.componentSelectorLabels" (dict "context" . "component" "realtime") | nindent 6 }}
{{- end }}
