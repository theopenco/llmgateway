{{- if .Values.realtime.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llmgateway.fullname" . }}-realtime
  labels:
    {{- include "llmgateway.componentLabels" (dict "context" . "component" "realtime") | nindent 4 }}
spec:
  replicas: {{ .Values.realtime.replicas | default 1 }}
  # Long-lived WebSocket sessions: never take a pod down before its
  # replacement is ready, so a rollout only ever drains one side at a time.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "llmgateway.componentSelectorLabels" (dict "context" . "component" "realtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llmgateway.componentSelectorLabels" (dict "context" . "component" "realtime") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "llmgateway.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "llmgateway.postgresql.host" . }} {{ include "llmgateway.postgresql.port" . }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
        - name: wait-for-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "llmgateway.redis.host" . }} {{ include "llmgateway.redis.port" . }}; do
                echo "Waiting for Redis..."
                sleep 2
              done
      containers:
        - name: realtime
          image: {{ include "llmgateway.image" (dict "context" . "image" .Values.realtime.image) }}
          imagePullPolicy: {{ .Values.realtime.image.pullPolicy | default "IfNotPresent" }}
          command: ["node", "--enable-source-maps", "dist/realtime/serve.js"]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "llmgateway.configMapName" . }}
            - secretRef:
                name: {{ include "llmgateway.secretName" . }}
          env:
            - name: REALTIME_PORT
              value: "80"
            - name: REALTIME_MAX_SESSION_SECONDS
              value: {{ .Values.realtime.config.maxSessionSeconds | default 3600 | quote }}
            - name: REALTIME_MAX_SESSION_SPEND_USD
              value: {{ .Values.realtime.config.maxSessionSpendUsd | default "10" | quote }}
            - name: REALTIME_MAX_SESSIONS_PER_ORG
              value: {{ .Values.realtime.config.maxSessionsPerOrg | default 20 | quote }}
            - name: REALTIME_MAX_SESSIONS_PER_KEY
              value: {{ .Values.realtime.config.maxSessionsPerKey | default 10 | quote }}
            {{- with .Values.realtime.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.realtime.resources | nindent 12 }}
      # Must exceed the configured maximum session duration plus drain time so
      # active sessions are never force-killed by a rolling deploy.
      terminationGracePeriodSeconds: {{ .Values.realtime.terminationGracePeriodSeconds | default 3720 }}
      {{- with .Values.realtime.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.realtime.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
