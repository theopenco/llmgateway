appId: io.llmgateway.lounge
---
# Keep the app alive between playback and recording to exercise session handoff.
# Place test-image.png in the dedicated simulator's local Files storage first.
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- runFlow:
    file: helpers/navigate.yaml
    env:
      DESTINATION: "Videos"
- tapOn: "Video model 1: Choose"
- tapOn:
    id: "field-search-models"
- inputText: "grok-imagine-video-1-5"
- tapOn: "Done typing"
- tapOn:
    text: "Choose Grok Imagine Video 1.5"
    index: 0
- scrollUntilVisible:
    element: "Choose start frame"
    direction: DOWN
- tapOn: "Choose start frame"
- waitForAnimationToEnd:
    timeout: 5000
# iOS 26 omits remote Files entries from its accessibility tree.
- tapOn:
    point: 70%, 95%
- tapOn:
    point: 18%, 30%
- runFlow:
    when:
      notVisible: "Video Studio"
    commands:
      - tapOn:
          point: 18%, 30%
- scrollUntilVisible:
    element: "Remove start frame"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "field-video-prompt"
    direction: DOWN
- tapOn:
    id: "field-video-prompt"
- inputText: "Native playback to microphone handoff"
- tapOn: "Done typing"
- scrollUntilVisible:
    element: "Generate video"
    direction: DOWN
- tapOn: "Generate video"
- scrollUntilVisible:
    element: "Refresh video"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Play"
      enabled: true
    direction: DOWN
    timeout: 90000
- tapOn:
    text: "Play"
    enabled: true
    waitToSettleTimeoutMs: 200
- assertVisible:
    text: "Pause playback|Replay"
    enabled: true
- tapOn: "Refresh video"
- extendedWaitUntil:
    visible:
      text: "Play"
      enabled: true
    timeout: 90000
- tapOn:
    text: "Play"
    enabled: true
    waitToSettleTimeoutMs: 200
- assertVisible:
    text: "Pause playback|Replay"
    enabled: true
- tapOn:
    id: "BackButton"
- assertVisible: "Dictate message"
- tapOn: "Dictate message"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow: helpers/dictation-ready.yaml
- tapOn: "Done"
- extendedWaitUntil:
    notVisible: "Dictate a message"
    timeout: 15000
- assertVisible: "Welcome to the Lounge.*"
- takeScreenshot: artifacts/video-microphone-dictation
- tapOn: "New conversation"
- tapOn: "Dictate message"
- runFlow: helpers/dictation-ready.yaml
- tapOn: "Cancel dictation"
- assertNotVisible: "Welcome to the Lounge.*"
- assertVisible: "Start voice conversation"
- runFlow: helpers/transcription-model.yaml
- scrollUntilVisible:
    element: "Start transcription"
    direction: DOWN
- tapOn:
    text: "Start transcription"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Stop transcription"
    timeout: 30000
- scrollUntilVisible:
    element: "Welcome to the Lounge."
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element: "Stop transcription"
    direction: UP
- tapOn:
    text: "Stop transcription"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Start transcription"
    timeout: 15000
- runFlow:
    file: helpers/navigate.yaml
    env:
      DESTINATION: "Voice calls"
- tapOn: "Model: Choose"
- tapOn:
    id: "field-search-models"
- inputText: "gemini-3.1-flash-live-preview"
- tapOn: "Done typing"
- tapOn: "Choose Gemini 3.1 Flash Live Preview"
- tapOn: "Voice: Kore"
- tapOn: "Puck"
- tapOn:
    text: "Start voice call"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "End call"
    timeout: 30000
- scrollUntilVisible:
    element: "Hello! Let's talk."
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element: "End call"
    direction: UP
- tapOn:
    text: "End call"
    waitToSettleTimeoutMs: 200
- scrollUntilVisible:
    element:
      text: "Start voice call"
      enabled: true
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element: "This model supports new calls.*"
    direction: DOWN
    timeout: 20000
- assertNotVisible: "Continue this call"
- takeScreenshot: artifacts/video-microphone-gemini
