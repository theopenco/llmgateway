appId: io.llmgateway.lounge
---
- evalScript: ${output.chatTitle = "Pinned native model " + Date.now()}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- tapOn: "New conversation"
- runFlow: helpers/close-chat-options.yaml
- tapOn: "Model: Auto"
- tapOn:
    id: "field-search-models"
- inputText: "gpt-4o-mini"
- tapOn: "Done typing"
- runFlow:
    when:
      visible: "Unfavorite GPT-4o Mini"
    commands:
      - tapOn: "Unfavorite GPT-4o Mini"
- tapOn: "Favorite GPT-4o Mini"
- assertVisible: "Unfavorite GPT-4o Mini"
- tapOn: "Providers for GPT-4o Mini"
- scrollUntilVisible:
    element: "Use OpenAI"
    direction: DOWN
- tapOn: "Use OpenAI"
- assertVisible: "Model: openai/gpt-4o-mini"
- runFlow: helpers/close-chat-options.yaml
- tapOn: "Message.*"
- inputText: ${output.chatTitle}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: ".*This is a mock response from the test server.*"
    timeout: 30000
- launchApp
- runFlow: helpers/organization.yaml
- runFlow:
    file: helpers/navigate.yaml
    env:
      DESTINATION: "Conversations"
- tapOn:
    id: "field-search-conversations"
- inputText: ${output.chatTitle}
- tapOn: "Done typing"
- tapOn: ".*openai/gpt-4o-mini, 2 messages"
- assertVisible: "Model: openai/gpt-4o-mini"
- runFlow: helpers/close-chat-options.yaml
- tapOn: "Model: openai/gpt-4o-mini"
- tapOn:
    id: "field-search-models"
- inputText: "gpt-4o-mini"
- tapOn: "Done typing"
- assertVisible: "Unfavorite GPT-4o Mini"
- tapOn: "Unfavorite GPT-4o Mini"
- assertVisible: "Favorite GPT-4o Mini"
- tapOn: "Auto route"
- assertVisible: "Model: Auto"
