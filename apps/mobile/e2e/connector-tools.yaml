appId: io.llmgateway.lounge
env:
  FIXTURE_URL: http://localhost:4909
---
- evalScript: ${output.chatTitle = "NATIVE_CONNECTOR_READ " + Date.now()}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- scrollUntilVisible:
    element: "Connectors"
    direction: DOWN
- tapOn: "Connectors"
- tapOn:
    id: "field-search-connectors"
- inputText: "Gmail"
- tapOn: "Done typing"
- runFlow:
    when:
      visible: "Disconnect Gmail"
    commands:
      - tapOn: "Disconnect Gmail"
      - tapOn: "Disconnect"
- tapOn: "Connect Gmail"
- runFlow: helpers/connector-browser.yaml
- tapOn: "Allow access"
- extendedWaitUntil:
    visible: "Connected to Gmail."
    timeout: 20000
- evalScript: ${output.callsBefore = JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls}
- launchApp
- runFlow: helpers/organization.yaml
- tapOn: "Start a conversation"
- runFlow: helpers/chat-model.yaml
- tapOn: "Message.*"
- inputText: ${output.chatTitle}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "Approve Gmail: search messages"
    timeout: 30000
- assertTrue: ${JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls === output.callsBefore}
- launchApp
- runFlow: helpers/organization.yaml
- tapOn: "Conversations"
- tapOn:
    id: "field-search-conversations"
- inputText: ${output.chatTitle}
- tapOn: "Done typing"
- tapOn: ".*2 messages"
- scrollUntilVisible:
    element: "Approve Gmail: search messages"
    direction: DOWN
- assertTrue: ${JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls === output.callsBefore}
- tapOn: "Approve Gmail: search messages"
- scrollUntilVisible:
    element: "Approve Gmail: read message"
    direction: DOWN
    timeout: 30000
- assertTrue: ${JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls === output.callsBefore + 1}
- tapOn: "Approve Gmail: read message"
- scrollUntilVisible:
    element: "The demo meeting starts at noon."
    direction: UP
    timeout: 30000
- assertTrue: ${JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls === output.callsBefore + 2}
- launchApp
- runFlow: helpers/organization.yaml
- tapOn: "Conversations"
- tapOn:
    id: "field-search-conversations"
- inputText: ${output.chatTitle}
- tapOn: "Done typing"
- tapOn: ".*2 messages"
- assertNotVisible: "Approve Gmail:.*"
- scrollUntilVisible:
    element: "The demo meeting starts at noon."
    direction: UP
- tapOn: "Message.*"
- inputText: ${"NATIVE_CONNECTOR_REJECT " + Date.now()}
- tapOn: "Send message"
- scrollUntilVisible:
    element: "Decline Gmail: search messages"
    direction: DOWN
    timeout: 30000
- tapOn: "Decline Gmail: search messages"
- extendedWaitUntil:
    visible: "Request declined. No mailbox access was performed."
    timeout: 30000
- assertTrue: ${JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls === output.callsBefore + 2}
