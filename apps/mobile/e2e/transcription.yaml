appId: io.llmgateway.lounge
---
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- runFlow: helpers/transcription-model.yaml
- tapOn:
    id: "transcription-automatic"
- scrollUntilVisible:
    element: "Start transcription"
    direction: DOWN
- tapOn:
    text: "Start transcription"
    waitToSettleTimeoutMs: 200
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "Stop transcription"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Transcribe turn"
      enabled: true
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Mute microphone"
    waitToSettleTimeoutMs: 200
- assertVisible: "Microphone muted"
- tapOn:
    text: "Transcribe turn"
    waitToSettleTimeoutMs: 200
- scrollUntilVisible:
    element: "Welcome to the Lounge."
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element: "Unmute microphone"
    direction: UP
- tapOn:
    text: "Unmute microphone"
    waitToSettleTimeoutMs: 200
- scrollUntilVisible:
    element:
      text: "Transcribe turn"
      enabled: true
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Stop transcription"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Start transcription"
    timeout: 15000
- scrollUntilVisible:
    element: "Copy transcript"
    direction: DOWN
- tapOn: "Copy transcript"
- assertVisible: "Transcript copied"
- scrollUntilVisible:
    element: "2 completed turns.*"
    direction: DOWN
- tapOn: "Clear transcript"
- assertNotVisible: "Welcome to the Lounge."
- scrollUntilVisible:
    element: "Automatic speech detection"
    direction: UP
- tapOn:
    id: "transcription-automatic"
- scrollUntilVisible:
    element: "Start transcription"
    direction: DOWN
- tapOn:
    text: "Start transcription"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Stop transcription"
    timeout: 30000
- scrollUntilVisible:
    element: "Welcome to the Lounge."
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element: "Stop transcription"
    direction: UP
- tapOn:
    text: "Stop transcription"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Start transcription"
    timeout: 15000
- tapOn:
    text: "Start transcription"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Stop transcription"
    timeout: 30000
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Start transcription"
    timeout: 15000
