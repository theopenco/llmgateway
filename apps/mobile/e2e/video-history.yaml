appId: io.llmgateway.lounge
---
- evalScript: ${output.renamedVideo = "Renamed video " + Date.now()}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- scrollUntilVisible:
    element: "Video Studio"
    direction: DOWN
- tapOn: "Video Studio"
- scrollUntilVisible:
    element:
      id: "field-search-videos"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "field-search-videos"
- inputText: "Native video comparison"
- tapOn: "Done typing"
- scrollUntilVisible:
    element:
      text: "Native video comparison .*"
      below:
        id: "field-search-videos"
      index: 0
    direction: DOWN
- tapOn:
    text: "Native video comparison .*"
    below:
      id: "field-search-videos"
    index: 0
- scrollUntilVisible:
    element: "Generate video"
    direction: UP
- scrollUntilVisible:
    element:
      text: "Share video"
      index: 0
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Share video"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Copy"
- tapOn:
    point: 50%, 30%
- scrollUntilVisible:
    element: "Rename video"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Rename video"
    index: 0
- eraseText
- inputText: ${output.renamedVideo}
- tapOn: "OK"
- scrollUntilVisible:
    element:
      id: "field-search-videos"
    direction: UP
    centerElement: true
- tapOn:
    id: "field-search-videos"
- eraseText
- inputText: ${output.renamedVideo}
- tapOn: "Done typing"
- scrollUntilVisible:
    element:
      text: ${output.renamedVideo}
      below:
        id: "field-search-videos"
    direction: DOWN
- assertVisible:
    text: ${output.renamedVideo}
    below:
      id: "field-search-videos"
- scrollUntilVisible:
    element: "Delete video"
    direction: DOWN
- tapOn: "Delete video"
- tapOn: "Delete generation"
- assertNotVisible:
    text: ${output.renamedVideo}
    below:
      id: "field-search-videos"
