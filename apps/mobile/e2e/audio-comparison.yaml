appId: io.llmgateway.lounge
---
- evalScript: ${output.audioPrompt = "Native audio comparison " + Date.now()}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- scrollUntilVisible:
    element: "Audio Studio"
    direction: DOWN
- tapOn: "Audio Studio"
- tapOn: "Audio model 1: Choose"
- tapOn:
    id: "field-search-models"
- inputText: "tts-1"
- tapOn: "Done typing"
- tapOn: "Choose TTS-1"
- tapOn: "Compare another audio model"
- tapOn: "Audio model 2: Choose"
- tapOn:
    id: "field-search-models"
- inputText: "gpt-4o-mini-tts"
- tapOn: "Done typing"
- tapOn: "Choose GPT-4o Mini TTS"
- scrollUntilVisible:
    element:
      id: "field-words-to-speak"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "field-words-to-speak"
- inputText: ${output.audioPrompt}
- tapOn: "Done typing"
- scrollUntilVisible:
    element: "Generate speech"
    direction: DOWN
- tapOn: "Generate speech"
- scrollUntilVisible:
    element:
      text: "Play"
      below: "tts-1"
      enabled: true
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    text: "Play"
    below: "tts-1"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Replay"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Play"
      below: "gpt-4o-mini-tts"
      enabled: true
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Play"
    below: "gpt-4o-mini-tts"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      text: "Replay"
      below: "gpt-4o-mini-tts"
    timeout: 15000
- launchApp
- runFlow: helpers/organization.yaml
- scrollUntilVisible:
    element: "Audio Studio"
    direction: DOWN
- tapOn: "Audio Studio"
- scrollUntilVisible:
    element:
      id: "field-search-audio"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "field-search-audio"
- inputText: ${output.audioPrompt}
- tapOn: "Done typing"
- scrollUntilVisible:
    element: '${"Play saved audio: " + output.audioPrompt}'
    direction: DOWN
- tapOn: '${"Play saved audio: " + output.audioPrompt}'
- scrollUntilVisible:
    element: "Generate speech"
    direction: UP
- scrollUntilVisible:
    element:
      text: "Play"
      below: "gpt-4o-mini-tts"
      enabled: true
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Play"
    below: "gpt-4o-mini-tts"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      text: "Replay"
      below: "gpt-4o-mini-tts"
    timeout: 15000
