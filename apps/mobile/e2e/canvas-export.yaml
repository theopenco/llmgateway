appId: io.llmgateway.lounge
---
- launchApp
- runFlow: helpers/organization.yaml
- scrollUntilVisible:
    element: "Canvas"
    direction: DOWN
    timeout: 20000
- tapOn: "Canvas"
- tapOn: "Templates"
- tapOn: "Dashboard"
- extendedWaitUntil:
    visible: "Analytics Dashboard"
    timeout: 20000
- tapOn: "Export"
- tapOn: "Save PNG"
- runFlow:
    file: helpers/save-file.yaml
    env:
      RETURN_TO: "Analytics Dashboard"
- tapOn: "Export"
- tapOn: "Save PDF"
- runFlow:
    file: helpers/save-file.yaml
    env:
      RETURN_TO: "Analytics Dashboard"
- tapOn: "Export"
- tapOn: "Share PNG"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 15000
- tapOn:
    point: 50%, 30%
- assertVisible: "Analytics Dashboard"
- tapOn: "Export"
- tapOn: "Share PDF"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 15000
- tapOn:
    point: 50%, 30%
- assertVisible: "Analytics Dashboard"
- swipe:
    start: 90%, 17%
    end: 20%, 17%
    duration: 500
- tapOn: "New"
- tapOn: "Cancel"
- assertVisible: "Analytics Dashboard"
- tapOn: "New"
- tapOn: "Reset canvas"
- assertVisible: "No canvas yet"
