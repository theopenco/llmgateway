appId: io.llmgateway.lounge
---
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- runFlow:
    file: helpers/navigate.yaml
    env:
      DESTINATION: "Voice calls"
- runFlow: helpers/close-chat-options.yaml
- tapOn: "Model: Choose"
- tapOn:
    id: "field-search-models"
- inputText: "gemini-3.1-flash-live-preview"
- tapOn: "Done typing"
- tapOn: "Choose Gemini 3.1 Flash Live Preview"
- tapOn: "Voice: Kore"
- tapOn: "Puck"
- tapOn:
    text: "Start voice call"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "End call"
    timeout: 30000
- scrollUntilVisible:
    element: "Hello! Let's talk."
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element: "End call"
    direction: UP
- tapOn:
    text: "End call"
    waitToSettleTimeoutMs: 200
- scrollUntilVisible:
    element:
      text: "Start voice call"
      enabled: true
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element: "This model supports new calls.*"
    direction: DOWN
    timeout: 20000
- assertNotVisible: "Continue this call"
- scrollUntilVisible:
    element: "Replay assistant turn 2"
    direction: DOWN
- tapOn: "Replay assistant turn 2"
- scrollUntilVisible:
    element: "Play"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Play"
    waitToSettleTimeoutMs: 200
- assertVisible: "Pause playback"
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: "Play"
