appId: io.llmgateway.lounge
---
# Run images.yaml first to place its generated PNG in Files.
- evalScript: ${output.chatTitle = "Native attachment " + Date.now()}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- tapOn: "New conversation"
- runFlow: helpers/close-chat-options.yaml
- tapOn: "Model: Auto"
- tapOn:
    id: "field-search-models"
- inputText: "gpt-4o-mini"
- tapOn: "Done typing"
- tapOn: "Choose GPT-4o Mini"
- tapOn: "Attach file"
- waitForAnimationToEnd:
    timeout: 5000
# iOS 26's remote Files picker omits file entries from its accessibility tree.
- tapOn:
    point: "18%,30%"
- assertVisible: "Remove Lounge-.*"
- runFlow: helpers/close-chat-options.yaml
- tapOn: "Message.*"
- inputText: ${output.chatTitle}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "Retry last response"
    timeout: 30000
- launchApp
- runFlow: helpers/organization.yaml
- runFlow:
    file: helpers/navigate.yaml
    env:
      DESTINATION: "Conversations"
- tapOn:
    id: "field-search-conversations"
- inputText: ${output.chatTitle}
- tapOn: "Done typing"
- tapOn: ".*2 messages"
- scrollUntilVisible:
    element: "Save Image 1.png"
    direction: UP
    timeout: 45000
- assertVisible: "Save Image 1.png"
- runFlow:
    when:
      visible: "Dismiss keyboard"
    commands:
      - tapOn: "Dismiss keyboard"
- scrollUntilVisible:
    element: "Retry last response"
    direction: DOWN
    timeout: 30000
- tapOn: "Retry last response"
- extendedWaitUntil:
    visible: "Retry last response"
    timeout: 30000
- scrollUntilVisible:
    element: "Edit message"
    direction: UP
    timeout: 45000
- tapOn: "Edit message"
- tapOn:
    id: "field-edited-message"
- eraseText
- inputText: "Describe this attached image"
- tapOn: "Done typing"
- tapOn: "Save and regenerate"
- extendedWaitUntil:
    visible: "Retry last response"
    timeout: 30000
- scrollUntilVisible:
    element: "Save Image 1.png"
    direction: UP
    timeout: 45000
- assertVisible: "Save Image 1.png"
