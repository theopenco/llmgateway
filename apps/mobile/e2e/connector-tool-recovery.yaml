appId: io.llmgateway.lounge
env:
  FIXTURE_URL: http://localhost:4909
---
- evalScript: ${output.temporaryTitle = "NATIVE_CONNECTOR_REJECT temporary " + Date.now()}
- evalScript: ${output.stoppedTitle = "NATIVE_CONNECTOR_STOP " + Date.now()}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- scrollUntilVisible:
    element: "Connectors"
    direction: DOWN
- tapOn: "Connectors"
- tapOn:
    id: "field-search-connectors"
- inputText: "Gmail"
- tapOn: "Done typing"
- runFlow:
    when:
      visible: "Connect Gmail"
    commands:
      - tapOn: "Connect Gmail"
      - runFlow: helpers/connector-browser.yaml
      - tapOn: "Allow access"
      - extendedWaitUntil:
          visible: "Connected to Gmail."
          timeout: 20000
- runFlow:
    when:
      visible: "Paused"
    commands:
      - tapOn: "Enable Gmail"
- evalScript: ${output.callsBefore = JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls}
- launchApp
- runFlow: helpers/organization.yaml
- tapOn: "Start a conversation"
- runFlow: helpers/chat-model.yaml
- tapOn: "Temporary conversation"
- tapOn: "Message.*"
- inputText: ${output.temporaryTitle}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "Decline Gmail: search messages"
    timeout: 30000
- tapOn: "Decline Gmail: search messages"
- extendedWaitUntil:
    visible: "Request declined. No mailbox access was performed."
    timeout: 30000
- assertTrue: ${JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls === output.callsBefore}
- launchApp
- runFlow: helpers/organization.yaml
- tapOn: "Conversations"
- tapOn:
    id: "field-search-conversations"
- inputText: ${output.temporaryTitle}
- tapOn: "Done typing"
- assertVisible: "No matching conversations."
- launchApp
- runFlow: helpers/organization.yaml
- tapOn: "Start a conversation"
- runFlow: helpers/chat-model.yaml
- tapOn: "Message.*"
- inputText: ${output.stoppedTitle}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "Approve Gmail: search messages"
    timeout: 30000
- tapOn: "Approve Gmail: search messages"
- extendedWaitUntil:
    visible: "Stop response"
    timeout: 10000
- assertTrue: ${JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls === output.callsBefore + 1}
- tapOn: "Stop response"
- extendedWaitUntil:
    visible: "Continue response"
    timeout: 15000
- launchApp
- runFlow: helpers/organization.yaml
- tapOn: "Conversations"
- tapOn:
    id: "field-search-conversations"
- inputText: ${output.stoppedTitle}
- tapOn: "Done typing"
- tapOn: ".*2 messages"
- assertNotVisible: "Approve Gmail: search messages"
- tapOn: "Continue response"
- extendedWaitUntil:
    visible: "The previous action has an uncertain result. I will not repeat it."
    timeout: 30000
- assertTrue: ${JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls === output.callsBefore + 1}
