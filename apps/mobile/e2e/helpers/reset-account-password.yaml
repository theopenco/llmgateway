appId: io.llmgateway.lounge
---
- extendedWaitUntil:
    visible: "Set a new password"
    timeout: 30000
- tapOn:
    text: "••••••••"
    index: 0
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "Show password"
    commands:
      - tapOn: "Show password"
- tapOn:
    text: "••••••••"
    index: 0
- eraseText
- inputText: "Lounge-reset-password-2026"
- tapOn: "Confirm password"
- eraseText
- inputText: "Lounge-reset-password-2026"
- hideKeyboard
- tapOn: "Update password"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- takeScreenshot: account-reset-sign-in
