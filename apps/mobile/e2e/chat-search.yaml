appId: io.llmgateway.lounge
---
- evalScript: ${output.chatTitle = "A native garden " + Date.now(); output.search = "Sunflowers " + Date.now()}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- tapOn: "Start a conversation"
- tapOn: "Model: Auto"
- tapOn:
    id: "field-search-models"
- inputText: "gpt-4o-mini"
- tapOn: "Done typing"
- tapOn: "Choose GPT-4o Mini"
- tapOn: "Message.*"
- inputText: ${output.chatTitle}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "Retry last response"
    timeout: 30000
- tapOn: "Message.*"
- inputText: ${output.search}
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "Retry last response"
    timeout: 30000
- launchApp
- runFlow: helpers/organization.yaml
- tapOn: "Conversations"
- tapOn:
    id: "field-search-conversations"
- inputText: ${output.search}
- tapOn: "Done typing"
- assertVisible: ".*4 messages"
- tapOn: "Archive"
- assertVisible: "No matching conversations."
- tapOn: "Show archived conversations"
- assertVisible: ".*4 messages"
- tapOn: "Restore"
- tapOn: "Show active conversations"
- assertVisible: ".*4 messages"
