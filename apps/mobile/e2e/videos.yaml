appId: io.llmgateway.lounge
---
- evalScript: ${output.videoPrompt = "Native video " + Date.now()}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- runFlow:
    file: helpers/navigate.yaml
    env:
      DESTINATION: "Videos"
- tapOn: "Video model 1: Choose"
- tapOn:
    id: "field-search-models"
- inputText: "grok-imagine-video-1-5"
- tapOn: "Done typing"
- tapOn:
    text: "Choose Grok Imagine Video 1.5"
    index: 0
- scrollUntilVisible:
    element: "Choose start frame"
    direction: DOWN
- tapOn: "Choose start frame"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: 18%, 30%
- runFlow:
    when:
      notVisible: "Video Studio"
    commands:
      - tapOn:
          point: 18%, 30%
- scrollUntilVisible:
    element:
      id: "field-video-prompt"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "field-video-prompt"
- inputText: ${output.videoPrompt}
- tapOn: "Done typing"
- scrollUntilVisible:
    element: "Generate video"
    direction: DOWN
- tapOn: "Generate video"
- scrollUntilVisible:
    element: "Refresh video"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Play"
      enabled: true
    timeout: 90000
- tapOn:
    text: "Play"
    enabled: true
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Replay"
    timeout: 15000
- tapOn:
    text: "Replay"
    waitToSettleTimeoutMs: 200
- assertVisible: "Pause playback"
- tapOn:
    text: "Pause playback"
    waitToSettleTimeoutMs: 200
- launchApp
- runFlow: helpers/organization.yaml
- runFlow:
    file: helpers/navigate.yaml
    env:
      DESTINATION: "Videos"
- scrollUntilVisible:
    element:
      id: "field-search-videos"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "field-search-videos"
- inputText: ${output.videoPrompt}
- tapOn: "Done typing"
- scrollUntilVisible:
    element:
      text: ${output.videoPrompt}
      below:
        id: "field-search-videos"
    direction: DOWN
- tapOn:
    text: ${output.videoPrompt}
    below:
      id: "field-search-videos"
- scrollUntilVisible:
    element: "Play"
    direction: DOWN
- tapOn:
    text: "Play"
    enabled: true
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Replay"
    timeout: 15000
- scrollUntilVisible:
    element: "Save video"
    direction: DOWN
- tapOn: "Save video"
- runFlow:
    file: helpers/save-file.yaml
    env:
      RETURN_TO: "Share video"
