appId: io.llmgateway.lounge
---
- evalScript: ${output.audioPrompt = "Native speech " + Date.now()}
- evalScript: ${output.renamedAudio = "Renamed speech " + Date.now()}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- scrollUntilVisible:
    element: "Audio Studio"
    direction: DOWN
- tapOn: "Audio Studio"
- tapOn: "Audio model 1: Choose"
- tapOn:
    id: "field-search-models"
- inputText: "gpt-4o-mini-tts"
- tapOn: "Done typing"
- tapOn: "Choose GPT-4o Mini TTS"
- tapOn: "Voice: alloy"
- scrollUntilVisible:
    element: "nova"
    direction: DOWN
- tapOn: "nova"
- tapOn: "Audio format: mp3"
- tapOn: "wav"
- tapOn: "Speech speed: 1"
- tapOn: "1.25"
- scrollUntilVisible:
    element:
      id: "field-voice-instructions"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "field-voice-instructions"
- inputText: "Speak warmly and clearly."
- tapOn: "Done typing"
- scrollUntilVisible:
    element:
      id: "field-words-to-speak"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "field-words-to-speak"
- inputText: ${output.audioPrompt}
- tapOn: "Done typing"
- scrollUntilVisible:
    element: "Generate speech"
    direction: DOWN
- tapOn: "Generate speech"
- scrollUntilVisible:
    element:
      text: "Play"
      enabled: true
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    text: "Play"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Replay"
    timeout: 15000
- tapOn:
    text: "Replay"
    waitToSettleTimeoutMs: 200
- assertVisible: "Pause playback"
- tapOn:
    text: "Pause playback"
    waitToSettleTimeoutMs: 200
- scrollUntilVisible:
    element: "Save audio"
    direction: DOWN
- tapOn: "Save audio"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: 88%, 12%
- runFlow:
    when:
      notVisible: "Share audio"
    commands:
      - tapOn:
          point: 88%, 12%
- assertVisible: "Share audio"
- tapOn: "Share audio"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Copy"
- tapOn:
    point: 50%, 30%
- launchApp
- runFlow: helpers/organization.yaml
- scrollUntilVisible:
    element: "Audio Studio"
    direction: DOWN
- tapOn: "Audio Studio"
- scrollUntilVisible:
    element:
      id: "field-search-audio"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "field-search-audio"
- inputText: ${output.audioPrompt}
- tapOn: "Done typing"
- scrollUntilVisible:
    element: '${"Play saved audio: " + output.audioPrompt}'
    direction: DOWN
- tapOn: '${"Play saved audio: " + output.audioPrompt}'
- scrollUntilVisible:
    element: "Generate speech"
    direction: UP
- scrollUntilVisible:
    element:
      text: "Play"
      enabled: true
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Play"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Replay"
    timeout: 15000
- scrollUntilVisible:
    element: "Rename audio"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Rename audio"
    index: 0
- eraseText
- inputText: ${output.renamedAudio}
- tapOn: "OK"
- scrollUntilVisible:
    element:
      id: "field-search-audio"
    direction: UP
    centerElement: true
- tapOn:
    id: "field-search-audio"
- eraseText
- inputText: ${output.renamedAudio}
- tapOn: "Done typing"
- scrollUntilVisible:
    element: '${"Play saved audio: " + output.renamedAudio}'
    direction: DOWN
- assertVisible: '${"Play saved audio: " + output.renamedAudio}'
- scrollUntilVisible:
    element: "Delete audio"
    direction: DOWN
- tapOn: "Delete audio"
- tapOn: "Delete audio generation"
- assertNotVisible: '${"Play saved audio: " + output.renamedAudio}'
