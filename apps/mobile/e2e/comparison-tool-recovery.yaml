appId: io.llmgateway.lounge
env:
  FIXTURE_URL: http://localhost:4909
---
- evalScript: ${output.stoppedTitle = "NATIVE_CONNECTOR_STOP " + Date.now()}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/organization.yaml
- runFlow: helpers/connect-mailbox.yaml
- evalScript: ${output.callsBefore = JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls}
- launchApp
- runFlow: helpers/organization.yaml
- runFlow: helpers/comparison.yaml
- tapOn:
    id: "field-message-to-all-models"
- inputText: ${output.stoppedTitle}
- tapOn: "Done typing"
- tapOn: "Send to all models"
- extendedWaitUntil:
    visible: "Approve Gmail: search messages"
    timeout: 30000
- tapOn: "Approve Gmail: search messages"
- extendedWaitUntil:
    visible: "Stop response"
    timeout: 10000
- assertTrue: ${JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls === output.callsBefore + 1}
- tapOn: "Stop response"
- extendedWaitUntil:
    visible: "Continue response"
    timeout: 15000
- launchApp
- runFlow: helpers/organization.yaml
- runFlow:
    file: helpers/navigate.yaml
    env:
      DESTINATION: "Conversations"
- tapOn:
    id: "field-search-conversations"
- inputText: ${output.stoppedTitle}
- tapOn: "Done typing"
- tapOn: ".*gpt-4o-mini, 2 messages"
- assertNotVisible: "Approve Gmail: search messages"
- tapOn: "Continue response"
- extendedWaitUntil:
    visible: "The previous action has an uncertain result. I will not repeat it."
    timeout: 30000
- assertTrue: ${JSON.parse(http.get(FIXTURE_URL + "/mock/connectors").body).toolCalls === output.callsBefore + 1}
- extendedWaitUntil:
    visible: "Retry this model"
    timeout: 30000
- takeScreenshot: comparison-tools-recovered
